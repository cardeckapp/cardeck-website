<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign for your vehicle · CarDeck</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1565D8">
<link rel="icon" href="favicon.png" type="image/png">
<style>
  :root{--blue:#1565D8;--navy:#0B1B33;--sky:#EAF3FF;--text:#1B2533;--muted:#5B6878;--line:#E3E9F1;--green:#16A34A;--red:#DC2626}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:linear-gradient(180deg,var(--sky) 0%,#fff 240px);min-height:100vh;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:20px 18px 40px}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .top img{width:44px;height:44px;border-radius:12px;object-fit:cover;background:#fff;border:1px solid var(--line)}
  .top b{display:block;font-size:17px;color:var(--navy)}
  .top span{font-size:13px;color:var(--muted)}
  h1{font-size:28px;line-height:1.15;letter-spacing:-.6px;color:var(--navy);margin-bottom:6px}
  .sub{color:var(--muted);font-size:15px;margin-bottom:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:14px}
  .car{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:15px}
  .car+.car{border-top:1px solid var(--line)}
  .car small{color:var(--muted);font-family:Menlo,monospace}
  .dmg{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;border-radius:14px;padding:12px 14px;margin-bottom:14px}
  .dmg.ok{background:#E8F7EE;color:#14532D}.dmg.warn{background:#FEF3C7;color:#78350F}
  label{display:block;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;margin:6px 0 8px}
  input{width:100%;font-size:18px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);outline:none;font-family:inherit}
  input:focus{border-color:var(--blue)}
  .pad{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:18px;touch-action:none;overflow:hidden}
  canvas{display:block;width:100%;height:auto;touch-action:none}
  .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#A0A8B4;font-size:20px;font-weight:700;pointer-events:none}
  .line{position:absolute;left:18px;right:18px;bottom:22%;height:1.5px;background:#D5DAE2;pointer-events:none}
  .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
  .clear{background:none;border:none;color:var(--red);font-weight:700;font-size:15px;padding:6px 0;cursor:pointer}
  .turn{color:#9AA3AF;font-size:13px}
  .agree{color:var(--muted);font-size:14px;line-height:1.5;margin:14px 0 18px}
  .btn{width:100%;border:none;background:var(--blue);color:#fff;font-weight:700;font-size:18px;padding:16px;border-radius:999px;cursor:pointer}
  .btn:disabled{opacity:.5}
  .err{color:var(--red);font-weight:600;font-size:14px;margin-top:8px;min-height:18px}
  .done{text-align:center;padding:60px 10px}
  .done .ok{width:84px;height:84px;border-radius:50%;background:#E8F7EE;color:var(--green);display:flex;align-items:center;justify-content:center;font-size:44px;margin:0 auto 18px}
  .foot{text-align:center;color:#9AA3AF;font-size:12px;margin-top:22px}
  .foot a{color:#9AA3AF}
  @media (orientation:landscape) and (max-height:500px){.wrap{max-width:900px;padding-top:10px}h1{font-size:22px}.sub,.cars,.dmg{display:none}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <p class="sub" id="loading">Loading…</p>
</div>
<script>
(function () {
  var SUPABASE_URL = 'https://dpogvcifovbjvcnvoftf.supabase.co';
  var KEY = 'sb_publishable_3zCfOx5T9G4y-8xt1nRiqQ_4Gp1nmVF';
  var W = 300, H = 120; // same box the CarDeck app uses
  var token = new URLSearchParams(location.search).get('t') || '';
  var app = document.getElementById('app');

  function rpc(name, body) {
    return fetch(SUPABASE_URL + '/rest/v1/rpc/' + name, {
      method: 'POST',
      headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j && j.message || 'Error'); return j; }); });
  }
  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    for (var k in (attrs || {})) { if (k === 'text') e.textContent = attrs[k]; else if (k === 'cls') e.className = attrs[k]; else e.setAttribute(k, attrs[k]); }
    (kids || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }
  function message(icon, title, text) {
    app.innerHTML = '';
    app.appendChild(el('div', { cls: 'done' }, [el('div', { cls: 'ok', text: icon }), el('h1', { text: title }), el('p', { cls: 'sub', text: text })]));
    app.appendChild(el('p', { cls: 'foot' }, [document.createTextNode('Powered by '), el('a', { href: 'https://cardeckapp.com', text: 'CarDeck' })]));
  }

  if (!token) return message('!', 'Link not valid', 'Please ask the driver to send the link again.');

  rpc('get_sign_request', { p_token: token }).then(function (d) {
    if (!d || !d.ok) return message('!', d && d.reason === 'expired' ? 'This link has expired' : 'Link not valid', 'Please ask the driver to send a new link.');
    if (d.signed) return message('✓', 'Already signed', 'Thank you. This vehicle ' + d.phase + ' is already signed.');
    render(d);
  }).catch(function () { message('!', 'Something went wrong', 'Check your internet connection and open the link again.'); });

  function render(d) {
    app.innerHTML = '';
    var pickup = d.phase === 'pickup';
    var top = el('div', { cls: 'top' }, [
      d.logo ? el('img', { src: d.logo, alt: '' }) : null,
      el('div', {}, [el('b', { text: d.company || 'Carrier' }), el('span', { text: (d.load_number ? 'Load ' + d.load_number : '') })])
    ]);
    app.appendChild(top);
    app.appendChild(el('h1', { text: pickup ? 'Sign for your vehicle pickup' : 'Sign for your vehicle delivery' }));
    app.appendChild(el('p', { cls: 'sub', text: [d.stop, d.city].filter(Boolean).join(' · ') }));

    var cars = el('div', { cls: 'card cars' });
    (d.vehicles || []).forEach(function (v) {
      cars.appendChild(el('div', { cls: 'car' }, [el('span', { text: v.name || 'Vehicle' }), el('small', { text: v.vin ? '…' + v.vin : '' })]));
    });
    if ((d.vehicles || []).length) app.appendChild(cars);

    app.appendChild(el('div', { cls: 'dmg ' + (d.damages ? 'warn' : 'ok'), text: d.damages
      ? (d.damages + ' damage' + (d.damages === 1 ? '' : 's') + ' noted by the driver at ' + d.phase + '.')
      : ('No damages noted at ' + d.phase + '.') }));

    app.appendChild(el('label', { text: d.require_name ? 'Your full name (required)' : 'Your name' }));
    var name = el('input', { type: 'text', autocomplete: 'name', autocapitalize: 'words', placeholder: 'Full name' });
    name.value = d.contact || '';
    app.appendChild(name);

    app.appendChild(el('label', { text: 'Signature' }));
    var canvas = el('canvas');
    var hint = el('div', { cls: 'hint', text: 'Sign here' });
    var pad = el('div', { cls: 'pad' }, [canvas, el('div', { cls: 'line' }), hint]);
    app.appendChild(pad);
    var clear = el('button', { cls: 'clear', type: 'button', text: '↺ Clear signature' });
    app.appendChild(el('div', { cls: 'row' }, [clear, el('span', { cls: 'turn', text: 'Turn your phone for a bigger box' })]));
    app.appendChild(el('p', { cls: 'agree', text: pickup
      ? "By signing, I agree with the driver's condition report for the vehicle(s) at pickup."
      : 'By signing, I confirm I received the vehicle(s) and agree with the condition report at delivery.' }));
    var btn = el('button', { cls: 'btn', type: 'button', text: 'Sign and send' });
    app.appendChild(btn);
    var err = el('p', { cls: 'err' });
    app.appendChild(err);
    app.appendChild(el('p', { cls: 'foot' }, [document.createTextNode('Secure signing by '), el('a', { href: 'https://cardeckapp.com', text: 'CarDeck' })]));

    // Signature drawing, stored in the same 300 x 120 box as the app.
    var paths = [], current = null, ctx = canvas.getContext('2d');
    function size() {
      var w = pad.clientWidth, dpr = window.devicePixelRatio || 1;
      canvas.width = w * dpr; canvas.height = (w * H / W) * dpr;
      canvas.style.height = (w * H / W) + 'px';
      draw();
    }
    function draw() {
      var s = canvas.width / W;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.setTransform(s, 0, 0, s, 0, 0);
      ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0B0F19';
      paths.concat(current ? [current] : []).forEach(function (p) {
        ctx.beginPath();
        p.forEach(function (pt, i) { i ? ctx.lineTo(pt[0], pt[1]) : ctx.moveTo(pt[0], pt[1]); });
        if (p.length === 1) ctx.lineTo(p[0][0] + 0.5, p[0][1] + 0.5);
        ctx.stroke();
      });
      hint.style.display = paths.length || current ? 'none' : 'flex';
    }
    function point(e) {
      var r = canvas.getBoundingClientRect();
      return [Math.round(((e.clientX - r.left) / r.width) * W * 10) / 10, Math.round(((e.clientY - r.top) / r.width) * W * 10) / 10];
    }
    canvas.addEventListener('pointerdown', function (e) { e.preventDefault(); canvas.setPointerCapture(e.pointerId); current = [point(e)]; draw(); });
    canvas.addEventListener('pointermove', function (e) { if (!current) return; e.preventDefault(); current.push(point(e)); draw(); });
    function end() { if (current) { paths.push(current); current = null; draw(); } }
    canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
    clear.addEventListener('click', function () { paths = []; draw(); });
    window.addEventListener('resize', size);
    size();

    btn.addEventListener('click', function () {
      err.textContent = '';
      if (!paths.length) { err.textContent = 'Please sign in the box first.'; return; }
      var n = name.value.trim();
      if (d.require_name && !n) { err.textContent = 'Please type your name.'; return; }
      var svgPaths = paths.map(function (p) {
        return p.map(function (pt, i) { return (i ? 'L' : 'M') + pt[0] + ' ' + pt[1]; }).join(' ') + (p.length === 1 ? ' L' + (p[0][0] + 0.5) + ' ' + (p[0][1] + 0.5) : '');
      });
      btn.disabled = true; btn.textContent = 'Sending…';
      rpc('submit_sign_request', { p_token: token, p_name: n, p_paths: svgPaths }).then(function () {
        message('✓', 'Thank you!', 'Your signature was sent to ' + (d.company || 'the carrier') + '. You can close this page.');
      }).catch(function (e) {
        btn.disabled = false; btn.textContent = 'Sign and send';
        err.textContent = /Already/.test(e.message) ? 'This was already signed.' : 'Could not send. Check your internet and try again.';
      });
    });
  }
})();
</script>
</body>
</html>
